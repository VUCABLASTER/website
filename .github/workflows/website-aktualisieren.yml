name: Website aktualisieren

# Holt neue Folgen aus dem Feed von podcaster.de, transkribiert Folgen ohne Transkript (Whisper),
# aktualisiert Plattform-Links, baut die Website neu und veröffentlicht sie (main /docs → GitHub Pages).
#
# Läuft: stündlich (neue Folge im Feed → Seite aktualisiert sich), nach Änderungen an inhalte/ (z. B. über Pages CMS)
# und per Knopfdruck (Actions → „Website aktualisieren“ → Run workflow).
# Transkribieren passiert NUR per Knopfdruck oder wenn die Repository-Variable TRANSKRIBIEREN_AUTO auf „fehlende“ steht
# (Settings → Secrets and variables → Actions → Variables). Standard: aus.

on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths: ['inhalte/**', 'daten/plattform-links.json']
  workflow_dispatch:
    inputs:
      transkribieren:
        description: 'Transkribieren: „keine“ (Standard), „fehlende“ oder Folgennummern, z. B. „61,62“'
        default: keine
      learnings:
        description: 'Nur Key Learnings neu erzeugen (aus vorhandenem Transkript), Folgennummern, z. B. „63“. Überschreibt keine vorhandenen Learnings, zeigt sie aber im Log.'
        default: ''

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: website-aktualisieren
  cancel-in-progress: false

env:
  MODELL_KEY: whisper-modell-large-v3-turbo-vad-v6
  LLM_URL: https://huggingface.co/bartowski/Qwen2.5-14B-Instruct-GGUF/resolve/main/Qwen2.5-14B-Instruct-Q4_K_M.gguf

jobs:
  planen:
    runs-on: ubuntu-latest
    outputs:
      folgen: ${{ steps.plan.outputs.folgen }}
      kl: ${{ steps.plan.outputs.kl }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: |
          # Zeitplan und Pflege-Änderungen: nur neu bauen (Transkribieren nur, wenn TRANSKRIBIEREN_AUTO=fehlende gesetzt ist).
          # Knopfdruck: die Eingabe.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then AUSWAHL="${{ github.event.inputs.transkribieren }}"; else AUSWAHL="${{ vars.TRANSKRIBIEREN_AUTO || 'keine' }}"; fi
          FOLGEN=$(python werkzeuge/transkribieren.py --planen "$AUSWAHL")
          echo "folgen=$FOLGEN" >> "$GITHUB_OUTPUT"
          # Key Learnings: für jede neu transkribierte Folge, dazu per Knopfdruck einzelne Folgen
          KL=$(python -c "import json,sys; a=json.loads(sys.argv[1]); b=[int(x) for x in sys.argv[2].replace(' ','').split(',') if x.isdigit()]; print(json.dumps(sorted(set(a)|set(b))))" "$FOLGEN" "${{ github.event.inputs.learnings }}")
          echo "kl=$KL" >> "$GITHUB_OUTPUT"

  werkzeug:
    needs: planen
    if: needs.planen.outputs.folgen != '[]' || needs.planen.outputs.kl != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/modell
          key: ${{ env.MODELL_KEY }}
      - name: Whisper- und VAD-Modell laden (nur beim ersten Mal)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/modell
          curl -fsSL -o ~/modell/modell.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
          curl -fsSL -o ~/modell/vad.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
          ls -la ~/modell

  transkribieren:
    needs: [planen, werkzeug]
    if: needs.planen.outputs.folgen != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        nr: ${{ fromJSON(needs.planen.outputs.folgen) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: ~/modell
          key: ${{ env.MODELL_KEY }}
          fail-on-cache-miss: true
      - name: whisper.cpp für diesen Rechner bauen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ffmpeg
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build /tmp/wcpp/build -j 4 --target whisper-cli
      - run: python werkzeuge/transkribieren.py --nr ${{ matrix.nr }} --whisper /tmp/wcpp/build/bin/whisper-cli --modell ~/modell/modell.bin --vad-modell ~/modell/vad.bin --ziel ergebnis
      - uses: actions/upload-artifact@v4
        with:
          name: transkript-${{ matrix.nr }}
          path: ergebnis/
          retention-days: 7

  learnings:
    # Key Learnings mit einem freien Sprachmodell direkt auf dem GitHub-Rechner (llama.cpp, Qwen2.5-14B-Instruct).
    needs: [planen, werkzeug, transkribieren]
    if: always() && needs.planen.outputs.kl != '[]' && needs.werkzeug.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        nr: ${{ fromJSON(needs.planen.outputs.kl) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sprachmodell laden (ca. 9 GB, bei jedem Lauf; zu groß für den GitHub-Zwischenspeicher)
        run: |
          mkdir -p ~/llm
          curl -fsSL --retry 3 -o ~/llm/modell.gguf "$LLM_URL"
          ls -la ~/llm
      - uses: actions/download-artifact@v4
        with:
          name: transkript-${{ matrix.nr }}
          path: ergebnis
        continue-on-error: true
      - name: llama.cpp für diesen Rechner bauen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama
          cmake -S /tmp/llama -B /tmp/llama/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/llama/build -j 4 --target llama-server
      - name: Sprachmodell starten
        run: |
          nohup /tmp/llama/build/bin/llama-server -m ~/llm/modell.gguf -c 8192 -t 4 --host 127.0.0.1 --port 8080 > /tmp/llama.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && break; sleep 5; done
          curl -sf http://127.0.0.1:8080/health || (tail -50 /tmp/llama.log; exit 1)
      - name: Key Learnings erzeugen
        run: |
          NR=$(printf '%03d' ${{ matrix.nr }})
          VTT=ergebnis/$NR.vtt; [ -f "$VTT" ] || VTT=inhalte/transkripte/$NR.vtt
          python werkzeuge/key_learnings.py --erzeugen --nr ${{ matrix.nr }} --vtt "$VTT" --ausgabe kl/$NR.json
      - uses: actions/upload-artifact@v4
        with:
          name: learnings-${{ matrix.nr }}
          path: kl/
          retention-days: 7
          if-no-files-found: ignore

  bauen:
    needs: [planen, transkribieren, learnings]
    if: always() && needs.planen.result == 'success'
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright
      - uses: actions/download-artifact@v4
        with:
          pattern: transkript-*
          merge-multiple: true
          path: ergebnis
        continue-on-error: true
      - name: Neue Transkripte übernehmen
        run: |
          mkdir -p inhalte/transkripte
          if ls ergebnis/*.vtt >/dev/null 2>&1; then cp ergebnis/*.vtt inhalte/transkripte/; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: learnings-*
          merge-multiple: true
          path: kl
        continue-on-error: true
      - name: Spotify- und Amazon-Links neuer Folgen holen
        run: python werkzeuge/plattform_links_holen.py
        continue-on-error: true
      - run: python werkzeuge/build.py
      # Erst nach dem ersten Build: Er legt die Datei einer neuen Folge (inhalte/folgen/NNN.json) überhaupt erst an.
      - name: Key Learnings übernehmen (nur leere, ungeprüfte Folgen) und Seiten neu bauen
        run: |
          python werkzeuge/key_learnings.py --uebernehmen kl
          python werkzeuge/build.py --offline
        continue-on-error: true
      - name: Neue Folgen merken
        id: neu
        run: |
          NEU=$(git ls-files --others --exclude-standard inhalte/folgen | sed -E 's#.*/0*([0-9]+)\.json#\1#' | sort -n | tr '\n' ' ' | sed 's/ $//')
          echo "folgen=$NEU" >> "$GITHUB_OUTPUT"
          # Issue-Text jetzt erzeugen, solange der aktuelle Feed noch in daten/ liegt (wird beim Veröffentlichen zurückgesetzt)
          for NR in $NEU; do python werkzeuge/neue_folge_hinweis.py "$NR" > "$RUNNER_TEMP/hinweis-$NR.md" || echo "Bitte Angaben zu Folge #$NR in inhalte/folgen prüfen." > "$RUNNER_TEMP/hinweis-$NR.md"; done
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "VUCA Blaster Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs inhalte && [ -z "$(git ls-files --others --exclude-standard docs inhalte)" ]; then
            echo "Keine Änderungen an Website oder Inhalten."
          else
            git add -A docs inhalte daten/plattform-links.json daten/bilder.json
            git commit -m "Website automatisch aktualisiert"
            git checkout -- daten
            git pull --rebase --autostash
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Hinweis an Manuel zu neuen Folgen
        if: steps.neu.outputs.folgen != ''
        run: |
          for NR in ${{ steps.neu.outputs.folgen }}; do
            gh issue create --title "Neue Folge #$NR: Angaben prüfen und ergänzen" --body-file "$RUNNER_TEMP/hinweis-$NR.md" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
