# Pages CMS (https://pagescms.org): Formulare für die Folgen-Infos und Staffeln.
# Alles andere (Titel, Datum, Bild, Beschreibung, Links) kommt automatisch aus dem Feed von podcaster.de.
content:
  - name: folgen
    label: Folgen
    type: collection
    path: inhalte/folgen
    format: json
    view:
      fields: [nummer, titel, gast, hauptwert]
      default:
        sort: nummer
        order: desc
    fields:
      - name: nummer
        label: Folgennummer
        type: number
        description: Kommt aus dem Feed. Bitte nicht ändern.
      - name: titel
        label: Titel (aus dem Feed)
        type: string
        description: Wird automatisch aus dem Feed übernommen. Änderungen hier werden überschrieben.
      - name: gast
        label: Gast
        type: string
        description: Name, wie er auf der Seite stehen soll, z. B. „Dr. Maja Storch“.
      - name: rolle
        label: Rolle des Gasts
        type: string
        description: Eine Zeile, z. B. „Psychologin“.
      - name: teaser
        label: Ein Satz zum Inhalt
        type: text
        description: Erscheint im Archiv unter dem Titel und auf der Folgenseite.
      - name: staffel
        label: Staffel
        type: select
        description: Leer lassen, wenn die Folge zu keiner Themenstaffel gehört.
        options:
          values: [mut, optimismus]
      - name: hauptwert
        label: Hauptwert
        type: select
        options:
          values: [optimistisch, neugierig, mutig, authentisch, verbindend]
      - name: nebenwerte
        label: Nebenwerte
        type: select
        options:
          multiple: true
          values: [optimistisch, neugierig, mutig, authentisch, verbindend]
      - name: key_learnings
        label: Key Learnings
        type: string
        description: Bis zu drei kurze Sätze.
        list:
          max: 3
      - name: link_spotify
        label: Spotify-Link zur Folge
        type: string
        description: Nur nötig, wenn er nicht automatisch gefunden wird (Build-Hinweis). Link aus Spotify → Teilen → Link kopieren.
      - name: link_amazon
        label: Amazon-Music-Link zur Folge
        type: string
        description: Amazon hat keine Schnittstelle – bei neuen Folgen hier den Link aus Amazon Music → Teilen einfügen.
      - name: hinweis
        label: Hinweis zum Prüfen
        type: string
        description: Notizen aus dem Entwurf, z. B. unklare Schreibweisen. Nach dem Prüfen leeren.
      - name: geprueft
        label: Geprüft
        type: boolean
        description: Haken setzen, wenn die Angaben stimmen.
  - name: staffeln
    label: Staffeln
    type: file
    path: inhalte/staffeln.json
    format: json
    fields:
      - name: staffeln
        label: Staffeln
        type: object
        list: true
        fields:
          - name: id
            label: Kürzel
            type: string
            description: Kleinbuchstaben ohne Leerzeichen, z. B. „mut“. Neue Kürzel zusätzlich in .pages.yml unter „staffel“ eintragen.
          - name: name
            label: Name
            type: string
          - name: jahr
            label: Jahr
            type: number
          - name: folgen_geplant
            label: Geplante Folgen
            type: number
          - name: beschreibung
            label: Beschreibung
            type: text
